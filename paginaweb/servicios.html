<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANAHUIA & ASOCIADOS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #4e2a2a;
            font-family: "Libre Baskerville", serif;
            min-height: 100vh;
        }


        .barra-navegacion {
            width: 100%;
            padding: 18px 40px;
            background: linear-gradient(90deg,  #e6c14a, #faf7c1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 10;
        }

        .barra-navegacion .logo-nombre {
            color: #242423;
            font-size: 22px;
            letter-spacing: 2px;
        }

        .barra-navegacion .enlaces {
            display: flex;
            gap: 35px;
        }

        .barra-navegacion a {
            color: #111111;
            text-decoration: none;
            font-size: 17px;
            letter-spacing: 1px;
            transition: 0.3s ease;
        }

        .barra-navegacion a:hover,
        .barra-navegacion a.activo {
            color: #C9A227;
            text-shadow: 0 0 6px rgba(255,255,255,0.4);
        }

        .contenedor {
            width: 100%;
            height: calc(100vh - 72px); 
            display: flex;
            overflow: hidden;
        }

        .lado-izquierdo {
            width: 78%;
            height: 100%;
            position: relative;
            overflow: hidden;
            background-color: #4e2a2a;
        }

        .lado-izquierdo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .lado-izquierdo::after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(41, 6, 6, 0.2);
        }

        .titulo {
            position: absolute;
            z-index: 2;
            top: 42%;
            left: 12%;
        }

        .titulo h1 {
            font-size: clamp(45px, 6vw, 90px);
            font-weight: normal;
            color: #f5f1d8;
        }

        .titulo p {
            margin-top: 10px;
            font-size: 18px;
            color: #1b1b1b;
            letter-spacing: 2px;
        }

        .lado-derecho {
            width: 52%;
            height: 100%;
            margin-left: -7%;
            background: linear-gradient(135deg,  #faf7c1, #e6c14a);
            clip-path: polygon(
                16% 0,
                100% 0,
                100% 100%,
                0% 100%
            );
            position: relative;
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .menu {
            width: 70%;
            margin-left: 10%;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .menu a {
            text-decoration: none;
            color: #111111;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 0.3s ease;
        }

        .menu a span {
            font-family: Arial, sans-serif;
            font-size: 14px;
            margin-bottom: 10px;
            opacity: 0.7;
        }

        .menu a span::after {
            content: "";
            display: block;
            width: 30px;
            height: 1px;
            background-color: #a0811c;
            margin: 8px auto 0;
        }

        .menu a strong {
            font-size: clamp(25px, 3vw, 45px);
            font-weight: normal;
        }

        .menu a:hover {
            transform: translateX(8px);
            color: #a0811c;
        }

        .menu a:hover span {
            opacity: 1;
        }
        
         footer {
            background: #faf7c1;
            color: #252525;
            text-align: center;
            padding: 25px;
            font-size: 0.9rem;
        }

        footer span {
            color:#C9A227;
        }

        @media (max-width: 700px) {

            .barra-navegacion {
                flex-direction: column;
                gap: 12px;
                padding: 12px 20px;
            }

            .contenedor {
                flex-direction: column;
                height: auto;
                min-height: calc(100vh - 80px);
            }

            .lado-izquierdo {
                width: 100%;
                height: 50vh;
            }

            .lado-derecho {
                width: 100%;
                height: 50vh;
                margin-left: 0;
                clip-path: none;
            }

            .titulo {
                top: 35%;
                left: 8%;
            }

            .menu {
                width: 100%;
                margin-left: 0;
                gap: 15px;
            }

            .menu a strong {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

    <nav class="barra-navegacion">
        <div class="logo-nombre">MANAHUIA & ASOCIADOS</div>
        <div class="enlaces">
            <a href="op.html" class="activo">Inicio</a>
        </div>
    </nav>

    <main class="contenedor">

        <section class="lado-izquierdo">
            <img src="logo7.jpg" alt="Imagen principal">
            <div class="titulo">
                <h1> </h1>
            </div>
        </section>

        <section class="lado-derecho">
            <nav class="menu">
                <a href="abi.html">
                    <span>01</span>
                    <strong>Penal</strong>
                </a>
                <a href="yami.html">
                    <span>02</span>
                    <strong>Civil</strong>
                </a>
                <a href="Ambar.html">
                    <span>03</span>
                    <strong>Fiscal</strong>
                </a>
                <a href="adm.html">
                    <span>04</span>
                    <strong>Administrativo</strong>
                </a>
            </nav>
        </section>
    </main>
     <footer>

        © 2026
        <span>MANAHUIA & ASOCIADOS</span>
        | Todos los derechos reservados.

    </footer>
   
</body>
</html>
